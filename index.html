<script type="text/javascript">
(async function () {
//now clock
window.onload=function(){
setInterval(function(){
var day_list = ['日', '一', '二', '三', '四', '五', '六'];
var date=new Date();
var year=date.getFullYear(); //獲取當前年份
var mon=date.getMonth()+1; //獲取當前月份
var da=date.getDate(); //獲取當前日
var day=date.getDay(); //獲取當前星期幾
var h=date.getHours(); //獲取小時
var m=date.getMinutes(); //獲取分鐘
var s=date.getSeconds(); //獲取秒
if (h < 10){ h = '0' + h }
if (m < 10){ m = '0' + m }
if (s < 10){ s = '0' + s }
var d=document.getElementById('Date');
d.innerHTML= year+'年'+mon+'月'+da+'日'+'星期'+day_list[day]+'<br>'+h+'時'+m+'分'+s+'秒'; },1000) }

//openLight
var rgbled;
var Oled;

//temp
var dht;

//k1602aLCD Clock
var lcd1602;
var nowMinute;

//PM2.5
var g3;
	
//Random_Light
var rgbled;
var colorchange;
	
//moist switch
var relay;
var relayval;

function colour_random() {
  var num = Math.floor(Math.random() * Math.pow(2, 24));
  return '#' + ('00000' + num.toString(16)).substr(-6);
}

function get_time(t) {
  var varTime = new Date(),
    varHours = varTime.getHours(),
    varMinutes = varTime.getMinutes(),
    varSeconds = varTime.getSeconds();
  var varNow;
  if (t == "hms") {
    varNow = varHours + ":" + varMinutes + ":" + varSeconds;
  } else if (t == "h") {
    varNow = varHours;
  } else if (t == "m") {
    varNow = varMinutes;
  } else if (t == "s") {
    varNow = varSeconds;
  }
  return varNow;
}

function get_date(t) {
  var varDay = new Date(),
    varYear = varDay.getFullYear(),
    varMonth = varDay.getMonth() + 1,
    varDate = varDay.getDate();
  var varNow;
  if (t == "ymd") {
    varNow = varYear + "/" + varMonth + "/" + varDate;
  } else if (t == "mdy") {
    varNow = varMonth + "/" + varDate + "/" + varYear;
  } else if (t == "dmy") {
    varNow = varDate + "/" + varMonth + "/" + varYear;
  } else if (t == "y") {
    varNow = varYear;
  } else if (t == "m") {
    varNow = varMonth;
  } else if (t == "d") {
    varNow = varDate;
  }
  return varNow;
}

  //PM2.5
boardReady({board: 'Smart', device: 'BJN7N', transport: 'mqtt'}, function (board) {
  board.samplingInterval = 250;
	g3 = getG3(board, 12, 3);
	  g3.read(function (val) {
		document.getElementById('pm25').innerHTML = (['空氣品質<hr>','PM2.5:',g3.pm25,'<br>PM1.0:',g3.pm10].join(''));
		if (g3.pm25 >= 25 || g3.pm10 >= 20) {
			document.getElementById('airalter').style.fontSize = 24 + 'px';
      		document.getElementById('airalter').innerHTML = (['目前空氣品質不佳建議使用能淨化空氣的精油( ･ิω･ิ)'].join(''));
    }
	  }, 1500);
 }); 


boardReady({device: 'GjLLa'}, async function (board) {
  board.samplingInterval = 250;
  
  //Lcd Show Time
  lcd1602 = getLCD1602(board,13,12,0x27);
  if (get_time("m") < 10) {
    nowMinute = String('0') + String(get_time("m"));
  } else {
    nowMinute = String(get_time("m"));
  }
  lcd1602.cursor(0, 0);
  lcd1602.print((get_date("ymd")));
  lcd1602.print(([String('|') + String(get_time("h")),':',nowMinute].join('')));
  setInterval(function () {
    lcd1602.clear();
    lcd1602.cursor(0, 0);
    lcd1602.print((get_date("ymd")));
    lcd1602.print(([String('|') + String(get_time("h")),':',nowMinute].join('')));
  }, 1000 * 60);

  //led Light
  rgbled = getRGBLed(board, 5, 6, 7);
  Oled = false;
  document.getElementById('light1').addEventListener('click', function () {
    if (document.getElementById('light1').className == 'on') {
       document.getElementById('light1').className = 'off';
    } else {
      document.getElementById('light1').className = 'on';
    }
    Oled = !Oled;
    if (Oled) {
      rgbled.setColor('#33ccff');
    } else {
      rgbled.setColor('#000000');
    }
  });

  colorchange = false;
  document.getElementById('light2').addEventListener('click', async function () {
    colorchange = !colorchange;
    if (document.getElementById('light2').className == 'on') {
       document.getElementById('light2').className = 'off';
    } else {
      document.getElementById('light2').className = 'on';
    }
    while (colorchange) {
      rgbled.setColor(colour_random());
      await delay(1);
    }
    if (!colorchange) {
      rgbled.setColor('#000000');
    }
  });


	
  //moist switch
  relay = getRelay(board, 8);
  relay.off();
  relayval = 0;
  document.getElementById('moist').addEventListener('click', function () {
    if (document.getElementById('moist').className == 'on') {
       document.getElementById('moist').className = 'off';
    } else {
      document.getElementById('moist').className = 'on';
    }
    if (relayval == 0) {
      relayval = 1;
      relay.on();
    } else {
      relayval = 0;
      relay.off();
    }
  });

  //other
	
	
});

}());
	
//temp
boardReady({board: 'Smart', device: 'EXRQx', transport: 'mqtt'}, function (board) {
  board.samplingInterval = 50;
   dht = getDht(board, 4);
  dht.read(function(evt){
    document.getElementById('temp').innerHTML = (['溫溼度<hr>',dht.temperature,'度<br>',dht.humidity,'%<br>'].join(''));
  }, 1000);
});

</script>
